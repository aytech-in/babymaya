<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Aytekin</title>

<meta property="og:description" content="Live baby update from the Aytekin family.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080b24'/%3E%3Cpath d='M5 11a11 11 0 0 0 22 0c0 5-5 7-11 7S5 16 5 11z' fill='%23f6e8c6'/%3E%3Ccircle cx='16' cy='13' r='2.6' fill='%23ffd996'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,0..100;1,9..144,500..800,0..100&display=swap">
<style>
/* Layout: full-bleed night sky canvas with a rocking crescent-moon cradle; text column sits left on desktop and under the cradle on phones. */
:root{
  --night:#080b24; --indigo:#1a2060; --moon:#f6e8c6; --ember:#ffb487; --rose:#ff8aa9; --mist:#aab3ea;
  --fg:#f7efde; --fg-dim:#c7cbee; --line:rgba(170,179,234,.3); --glass:rgba(14,18,54,.58);
  --display:'Fraunces','Georgia',serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--night);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--fg);font:400 1rem/1.55 var(--body);overflow-x:clip;min-height:100svh}
body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,26,0) 0%,rgba(6,8,26,.3) 50%,rgba(6,8,26,.66) 100%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
button{font-family:inherit}

.wrap{position:relative;z-index:2;max-width:1240px;margin-inline:auto;padding-top:calc(clamp(18px,3vw,40px) + env(safe-area-inset-top,0px));padding-bottom:calc(clamp(40px,6vw,72px) + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:.65rem;font:500 .74rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
.live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 0 rgba(255,180,135,.7);animation:ping 2.2s ease-out infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,180,135,0)}100%{box-shadow:0 0 0 0 rgba(255,180,135,0)}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{background:none;border:0;color:var(--fg-dim);font:500 .74rem var(--mono);letter-spacing:.1em;padding:.4rem .75rem;min-height:32px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--moon);color:#1a1740}

.hero{display:flex;flex-direction:column;align-items:flex-start;gap:1.15rem;padding-top:clamp(215px,34svh,320px)}
@media (min-width:900px){.hero{width:min(100%,41rem);padding-top:clamp(36px,11svh,130px)}}
h1{margin:0;font-family:var(--display);font-weight:650;font-variation-settings:'SOFT' 100;font-size:clamp(2.35rem,1.1rem + 4.6vw,5.4rem);line-height:1.03;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 2px 30px rgba(5,6,22,.55)}
.w{display:inline-block;line-height:1.32;padding:0 .08em;margin:-.145em -.08em;color:var(--fg);animation:rise .95s cubic-bezier(.2,.7,.1,1) both;animation-delay:calc(var(--i) * 80ms + 120ms)}
@supports (background-clip:text) or (-webkit-background-clip:text){
  .w{background:linear-gradient(100deg,var(--fg) 0%,var(--moon) 30%,var(--ember) 50%,var(--moon) 70%,var(--fg) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
    animation:rise .95s cubic-bezier(.2,.7,.1,1) both,sheen 9s linear infinite;animation-delay:calc(var(--i) * 80ms + 120ms),calc(var(--i) * -.7s)}
}
@keyframes rise{from{opacity:0;transform:translateY(.55em) rotate(2.5deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sheen{from{background-position:100% 0}to{background-position:-200% 0}}
.sub{margin:0;max-width:34rem;font-size:clamp(1.05rem,.95rem + .4vw,1.3rem);color:var(--fg-dim);text-wrap:pretty;text-shadow:0 1px 18px rgba(5,6,22,.7);animation:fade 1.2s .7s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.babyname{display:flex;align-items:center;gap:1rem;margin:.2rem 0;font-family:var(--display);font-style:italic;font-weight:500;font-variation-settings:'SOFT' 100;font-size:clamp(2.6rem,1.4rem + 5vw,5.2rem);line-height:1;letter-spacing:-.01em;animation:fade 1.4s .8s both}
.babyname span{display:inline-block;padding:.08em .12em .26em;margin:-.08em -.12em -.26em;line-height:1.15;background:linear-gradient(100deg,var(--moon),var(--ember) 45%,var(--rose) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 22px rgba(255,160,150,.35))}
.babyname i{display:block;flex:none;width:clamp(28px,6vw,64px);height:1px;background:linear-gradient(90deg,transparent,var(--ember))}
.babyname i:last-child{background:linear-gradient(90deg,var(--ember),transparent)}
.welcome{margin:0;font-family:var(--display);font-size:clamp(1.6rem,1rem + 2.4vw,2.8rem);line-height:1.1;color:var(--moon);animation:fade 1.2s .9s both;overflow-wrap:anywhere}
.welcome em{font-style:italic;color:var(--ember);font-variation-settings:'SOFT' 100}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;animation:fade 1.2s 1s both}
.chip{display:block;padding:.5rem .95rem;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 .78rem/1.3 var(--mono);color:var(--fg);min-width:0}
.chip b{font-weight:500;color:var(--ember);font-variant-numeric:tabular-nums}
.chip span{color:var(--fg-dim)}
.note{width:100%;max-width:34rem;margin:0;padding:1rem 1.15rem;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fade 1.2s 1.1s both}
.note small{display:block;margin-bottom:.35rem;font:500 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.note p{margin:0;font-size:1.12rem;line-height:1.45;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:.7rem;width:100%;animation:fade 1.2s 1.2s both}
.tile{min-width:0;padding:.85rem 1rem;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tile small{display:block;font:500 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin-bottom:.2rem}
.tile strong{display:block;font:600 1.45rem/1.15 var(--display);font-variation-settings:'SOFT' 100;color:var(--moon);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.journey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:1 1 15rem;max-width:24rem;animation:fade 1.2s .4s both}
.journey li{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;font:500 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);min-width:0}
.journey i{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;border:2px solid var(--mist);background:var(--night)}
.journey li::before{content:"";position:absolute;top:7px;right:50%;width:100%;height:2px;background:var(--line)}
.journey li:first-child::before{display:none}
.journey li.done i{background:var(--ember);border-color:var(--ember)}
.journey li.done::before,.journey li.now::before{background:linear-gradient(90deg,var(--ember),var(--rose))}
.journey li.now{color:var(--fg)}
.journey li.now i{background:var(--moon);border-color:var(--moon);box-shadow:0 0 0 0 rgba(246,232,198,.75);animation:ping2 2s ease-out infinite}
@keyframes ping2{70%{box-shadow:0 0 0 12px rgba(246,232,198,0)}100%{box-shadow:0 0 0 0 rgba(246,232,198,0)}}
.foot{margin:2.2rem 0 0;font:400 .8rem var(--mono);color:var(--fg-dim);max-width:34rem;text-wrap:pretty}

@media (max-width:899px){
  .hero{padding-top:.4rem;gap:.8rem}
  .journey li{font-size:.6rem;letter-spacing:.04em}
  .top{gap:10px}
  .foot{margin-top:1.2rem;font-size:.74rem}
  .wrap{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .sub{font-size:1rem;line-height:1.45}
  .babyname{font-size:clamp(2.2rem,1.2rem + 5vw,3.2rem)}
  .note{padding:.8rem 1rem}.note p{font-size:1.02rem}
}

/* ---- couple illustrations ---- */
.duo{position:relative;z-index:2;width:min(100%,300px);margin:.3rem auto 0;pointer-events:auto;-webkit-tap-highlight-color:transparent;cursor:pointer}
.duo-svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 22px rgba(4,6,24,.45))}
.d-pop{transform-origin:200px 290px;animation:dpop 1.1s cubic-bezier(.2,1.4,.3,1) .5s both}
@keyframes dpop{from{opacity:0;transform:translateY(24px) scale(.88)}to{opacity:1;transform:none}}
.d-breathe{animation:dbreathe 4.2s ease-in-out infinite}
.d-b2{animation-delay:-1.7s;animation-duration:4.8s}
@keyframes dbreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.026)}}
.d-tilt{animation:dtilt 6s ease-in-out infinite}
.d-t2{animation-delay:-2.6s;animation-duration:7s}
@keyframes dtilt{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(2.2deg)}}
.d-blink{animation:dblink 5s infinite}
@keyframes dblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.d-kick{animation:dkick 5.5s ease-in-out infinite}
@keyframes dkick{0%,84%,100%{transform:scale(1)}88%{transform:scale(1.045,1.03)}92%{transform:scale(.985)}95%{transform:scale(1.025,1.02)}}
.d-dots circle{animation:ddots 2.4s ease-in-out infinite}
.d-dots circle:nth-child(2){animation-delay:.3s}.d-dots circle:nth-child(3){animation-delay:.6s}
@keyframes ddots{0%,100%{opacity:.15;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.d-z{animation:dz 5s ease-in-out infinite}
@keyframes dz{0%,100%{opacity:.25;transform:translateY(4px)}50%{opacity:.9;transform:translateY(-6px)}}
.d-tw{transform-box:fill-box;transform-origin:center;animation:dtw 3s ease-in-out infinite}.d-tw2{animation-delay:-1.4s}
@keyframes dtw{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
.d-heart{animation:dheart 1.1s ease-in-out infinite}
@keyframes dheart{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}34%{transform:scale(1)}50%{transform:scale(1.14)}66%{transform:scale(1)}}
.d-ecg{stroke-dasharray:420;stroke-dashoffset:420;animation:decg 3.2s linear infinite}
@keyframes decg{0%{stroke-dashoffset:420;opacity:0}12%{opacity:.9}80%{opacity:.9}100%{stroke-dashoffset:-420;opacity:0}}
.d-bag{animation:dbag 3.4s ease-in-out infinite}
@keyframes dbag{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.d-wave{animation:dwave 1.5s ease-in-out infinite}
@keyframes dwave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.d-baby{animation:dbaby 3.6s ease-in-out infinite}
@keyframes dbaby{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.05)}}
.d-conf{animation-name:dconf;animation-timing-function:linear;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
@keyframes dconf{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translateY(300px) rotate(540deg);opacity:.9}}
.d-floath{animation:dfloat 4s ease-in infinite}.d-fh2{animation-delay:-2s}
@keyframes dfloat{0%{transform:translateY(20px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
.duo.boop .d-pair{animation:dboop .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes dboop{0%{transform:translateY(0)}35%{transform:translateY(-14px) scale(1.02)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.duo *{animation:none!important}}
@media (min-width:900px){.duo{position:fixed;left:70%;top:46%;width:min(33vw,540px);margin:0;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style>
</head>
